[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magecart-scanner"
version = "0.1.0"
description = "Inventaire et détection d'altération des scripts d'une page de paiement (PCI DSS 4.0, 6.4.3 / 11.6.1). Prototype."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nisrine Khnifass" }]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
magecart-scanner = "magecart_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: test de bout en bout qui nécessite Playwright et Chromium"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
